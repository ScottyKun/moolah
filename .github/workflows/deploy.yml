name: CI / CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Vérifier et construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Failles connues dans les dépendances
        run: npm audit --audit-level=high
      - name: Vérification des types et des pages
        run: npx astro check
      - run: npm run build

  deploy:
    name: Deploiement
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Préparer la connexion SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Mettre à jour le code et reconstruire le conteneur
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ vars.VPS_PORT || '22' }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'SCRIPT'
            set -euo pipefail
            cd "${{ vars.APP_DIR }}"
            git fetch --quiet origin master
            git reset --hard origin/master   
            docker compose up -d --build --remove-orphans
            docker image prune -f
          SCRIPT

      - name: Vérifier que le site répond
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "https://${{ vars.SITE_HOST }}/"; then
              exit 0
            fi
            echo "Pas encore prêt (essai $i/12), nouvel essai dans 10 s…"
            sleep 10
          done
          echo "Le site ne répond pas en HTTPS valide après 2 minutes."
          exit 1

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/id_deploy