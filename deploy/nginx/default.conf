# nginx sert uniquement les fichiers du site. HTTPS, en-têtes de sécurité et
# limite de débit sont gérés par Traefik (voir compose.yaml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;           # redirections relatives : le port interne 8080 n'apparaît jamais
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/manifest+json text/plain;
    gzip_min_length 1024;

    # Site statique : seules les lectures sont acceptées
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

    # L'accueil n'a qu'une seule adresse : /
    location ~ ^/index(\.html)?$ { return 301 /; }

    # Fichiers générés par Astro (nom avec empreinte) : cache d'un an
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /chambres sert chambres.html ; /chambres.html redirige vers /chambres
    location / {
        add_header Cache-Control "public, max-age=600";
        if ($request_uri ~ ^/(.+)\.html$) { return 301 /$1; }
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~ /\. { return 404; }   # fichiers cachés jamais servis

    error_page 404 /404.html;
    location = /404.html { internal; }
}